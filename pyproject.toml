[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "encryptx"
version = "2.0.0"
description = "File/folder encryption, checksum tool and Windows Explorer integration"
requires-python = ">=3.9"
dependencies = ["cryptography>=42", "PySide6-Essentials>=6.6"]

[project.gui-scripts]
encryptx = "encryptx.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
